<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Dark Mode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z" fill="#38bdf8"/>
          </svg>
        </div>
        <div>
          <h1 class="title">Video Dark Mode</h1>
          <p class="subtitle">For white-themed code & slides</p>
        </div>
      </div>
      <div class="hotkey-badge" title="Shortcut to toggle anytime">Alt + D</div>
    </header>

    <!-- Main Toggle Card -->
    <div class="toggle-card" id="toggleCard">
      <div class="toggle-info">
        <span class="toggle-label">Dark Mode</span>
        <span class="toggle-status" id="toggleStatus">Disabled</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="masterToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Non-YouTube Banner (Hidden on YouTube) -->
    <div class="notice-banner" id="nonYoutubeBanner" style="display: none;">
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>Open a YouTube video to activate live preview.</span>
    </div>

    <!-- Presets Section -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Presets</span>
      </div>
      <div class="preset-grid">
        <button class="preset-btn active" data-preset="code" title="Smart invert for code editors, preserving syntax colors">
          <span class="preset-icon">💻</span>
          <span class="preset-name">Code / IDE</span>
        </button>
        <button class="preset-btn" data-preset="high-contrast" title="Deep blacks and heightened contrast">
          <span class="preset-icon">⚡</span>
          <span class="preset-name">High Contrast</span>
        </button>
        <button class="preset-btn" data-preset="slides" title="Softened dark mode for slides & documents">
          <span class="preset-icon">📄</span>
          <span class="preset-name">Slides & Docs</span>
        </button>
        <button class="preset-btn" data-preset="dimmer" title="Subtle night dimmer without color inversion">
          <span class="preset-icon">🌙</span>
          <span class="preset-name">Dimmer</span>
        </button>
      </div>
    </section>

    <!-- Fine-Tuning Sliders -->
    <section class="section">
      <div class="section-header">
        <span class="section-title">Fine-Tuning</span>
        <button class="reset-btn" id="resetBtn" title="Reset all sliders to current preset">Reset</button>
      </div>

      <div class="slider-group">
        <div class="slider-row">
          <div class="slider-label-row">
            <span>Invert</span>
            <span class="slider-val" id="valInvert">100%</span>
          </div>
          <input type="range" id="sliderInvert" min="0" max="100" value="100" step="1">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <span>Brightness</span>
            <span class="slider-val" id="valBrightness">92%</span>
          </div>
          <input type="range" id="sliderBrightness" min="50" max="150" value="92" step="1">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <span>Contrast</span>
            <span class="slider-val" id="valContrast">95%</span>
          </div>
          <input type="range" id="sliderContrast" min="50" max="150" value="95" step="1">
        </div>

        <div class="slider-row">
          <div class="slider-label-row">
            <span>Hue Shift</span>
            <span class="slider-val" id="valHue">180°</span>
          </div>
          <input type="range" id="sliderHue" min="0" max="360" value="180" step="5">
        </div>
      </div>
    </section>

    <!-- Preferences Footer -->
    <footer class="footer">
      <label class="checkbox-row" title="If enabled, dark mode remains ON across new videos.">
        <input type="checkbox" id="autoEnableToggle">
        <span>Auto-enable on new videos</span>
      </label>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
